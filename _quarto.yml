project:
  type: website
  render:
    - "*.qmd"
    - "**/*.qmd"
  pre-render:
    - uv run python tools/build_model_variables.py
    - uv run python tools/build_electrical_figures.py
    - tools/build-readiness-sidebar.js
    - tools/build-evidence-status.js
  resources:
    - figures/
    - readiness-sidebar.js
    - evidence-status.js

bibliography: references.bib

website:
  title: "Offshore Wind Infrastructure Model Assumptions"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Home
      - href: positioning.qmd
        text: Positioning
      - section: "Methodology"
        contents:
          - methodology/overview.qmd
          - methodology/system_boundary_and_lcoe.qmd
          - methodology/financial_and_price_basis.qmd
          - methodology/modelling_workflow.qmd
          - methodology/optimisation_variables.qmd
          - methodology/energy_availability_and_annualisation.qmd
      - section: "Architectures"
        contents:
          - architectures/overview.qmd
          - architectures/electricity_export_hvdc.qmd
          - architectures/centralised_hydrogen.qmd
          - architectures/decentralised_hydrogen.qmd
          - architectures/component_mapping.qmd
      - section: "Wind Resource and Layout"
        contents:
          - wind_resource_and_layout/overview.qmd
          - wind_resource_and_layout/wind_resource_and_weibull.qmd
          - wind_resource_and_layout/wake_modelling_and_spacing.qmd
      - section: "Turbine System"
        contents:
          - turbine_system/overview.qmd
          - turbine_system/wind_turbine.qmd
          - turbine_system/foundation.qmd
      - section: "Electrical Infrastructure"
        contents:
          - electrical_infra/overview.qmd
          - electrical_infra/infield_ac_cables.qmd
          - electrical_infra/hvdc_converter_stations.qmd
          - electrical_infra/hvdc_export_cables.qmd
          - electrical_infra/onshore_grid_connection.qmd
      - section: "Hydrogen Production"
        contents:
          - hydrogen_production/overview.qmd
          - hydrogen_production/dc_integration.qmd
          - hydrogen_production/stack.qmd
          - hydrogen_production/balance_of_plant.qmd
          - hydrogen_production/elx_power_electronics.qmd
      - section: "Hydrogen Infrastructure"
        contents:
          - hydrogen_infra/overview.qmd
          - hydrogen_infra/infield_infrastructure.qmd
          - hydrogen_infra/compressor.qmd
          - hydrogen_infra/hydrogen_pipelines.qmd
          - hydrogen_infra/pipeline_pressure_and_capacity.qmd
      - section: "Platforms"
        contents:
          - platforms/platform_material_capex.qmd
      - section: "Offshore Installation"
        contents:
          - offshore_installation/overview.qmd
          - offshore_installation/turbine_and_foundation_installation.qmd
          - offshore_installation/cable_and_pipeline_installation.qmd
          - offshore_installation/platform_and_substation_installation.qmd
      - references.qmd
      - about.qmd


format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    include-after-body:
      - readiness-sidebar.html
      - evidence-status.html
    toc: true

execute:
  echo: false
  warning: false
  message: false
