# Architecture template for the article case. Common inputs (site, coordinates,
# turbine, wind power states, overplanting, stack outlet and delivery pressure,
# export length) come from the generated common_case.toml; keys defined there
# must not be repeated here. Evidence and derivations: ../reference_case.qmd.
# Paths are relative to this file. Fill the commented fields below.
[case]
name = "centralised-article-case"
architecture = "centralised"
include = "common_case.toml"

[site]
# Central platform at the farm centre (agreed 2026-09-25), in the frame of
# common/coordinates.csv (x east, y north, origin at the farm centre).
collection_x_m = 0.0
collection_y_m = 0.0
# Coordinate row order defines the radial AC strings; this order is provisional.

[electrolysis]
stack_curve_file = "../../../numerical_inputs/pem_polarisation_curve.xlsx"

[hydrogen]
# injection_bar: absolute pressure, bar(a) (O7).
# export_diameter_m: true internal diameter (O7).

[platform]
# Exactly one platform. Complete topside includes all equipment and structure.
# Supply exactly one equipment_mass_t or topside_mass_t, in tonnes (O3).
# Alternatively mass_method = "power_scaling" with rated_power_gw and adopted
# platform-reference-topside-mass/platform-reference-power in inputs.csv.
# Do not supply direct mass and power_scaling together.

[installation]
# port_distance_km, intersite_distance_km
# [installation.collection] and [installation.export]: loads_per_campaign,
# port_distance_km, splices, burial_pass_km, burial_other_offshore_days,
# survey_pass_km. Loading plans remain explicit project inputs.

# Platform installation is included in EPCI; no separate lift/cost input.
# Installation feasibility remains an independent engineering assessment.

[overrides]
# Named, adopted central input IDs only; values retain their CSV units.
