# Architecture template for the article case. Common inputs come from the
# generated common_case.toml, as in centralised.toml; do not repeat its keys.
[case]
name = "decentralised-article-case"
architecture = "decentralised"
include = "common_case.toml"

[electrolysis]
interface = "converter_reduced"
stack_curve_file = "../../../numerical_inputs/pem_polarisation_curve.xlsx"
# Use interface = "conservative" for the other article case.

[hydrogen]
# injection_bar, export_inlet_bar: absolute pressures, bar(a) (O7).
# export_diameter_m (O7).

[collection]
# nodes_file: node,x_m,y_m (non-turbine nodes only); sink: export manifold node ID.
# sections_file: section,from,to,vertical_m,route_allowance,flow_share,
# diameter_m,inlet_bar,outlet_bar. All physical ladder sections belong here.
# Flow shares describe the selected healthy-state directed paths; zero-flow
# standby sections still contribute to the physical supply/installation inventory.

[installation]
# port_distance_km, intersite_distance_km; collection/export plans as in centralised.toml

[data]
# Optional pipeline_cost_module: path to the existing confidential local callable.
# Its unit-price normalization must be adopted in the central parameter CSV.

[overrides]
# Explicit sensitivity overrides, without editing the central baseline.
