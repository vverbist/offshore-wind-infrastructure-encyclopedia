<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">PEM polarisation curve and stack efficiency</title>
  <desc id="desc">Line plots of cell voltage and stack efficiency against current density, generated from numerical_inputs/pem_polarisation_curve.xlsx.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .title { font-size: 18px; font-weight: 700; }
    .axis-label { font-size: 13px; font-weight: 600; }
    .tick { font-size: 12px; fill: #4b5563; }
    .axis { stroke: #111827; stroke-width: 1.4; fill: none; }
    .grid { stroke: #d1d5db; stroke-width: 0.8; }
    .series { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="980" height="390" fill="#ffffff"/>

  <text x="256" y="34" class="title" text-anchor="middle">Polarisation curve</text>
  <line x1="86.0" y1="72.0" x2="86.0" y2="302.0" class="grid"/>
<text x="86.0" y="326.0" class="tick" text-anchor="middle">0</text>
<line x1="154.0" y1="72.0" x2="154.0" y2="302.0" class="grid"/>
<text x="154.0" y="326.0" class="tick" text-anchor="middle">1</text>
<line x1="222.0" y1="72.0" x2="222.0" y2="302.0" class="grid"/>
<text x="222.0" y="326.0" class="tick" text-anchor="middle">2</text>
<line x1="290.0" y1="72.0" x2="290.0" y2="302.0" class="grid"/>
<text x="290.0" y="326.0" class="tick" text-anchor="middle">3</text>
<line x1="358.0" y1="72.0" x2="358.0" y2="302.0" class="grid"/>
<text x="358.0" y="326.0" class="tick" text-anchor="middle">4</text>
<line x1="426.0" y1="72.0" x2="426.0" y2="302.0" class="grid"/>
<text x="426.0" y="326.0" class="tick" text-anchor="middle">5</text>
<line x1="86.0" y1="302.0" x2="426.0" y2="302.0" class="grid"/>
<text x="76.0" y="306.0" class="tick" text-anchor="end">1.4</text>
<line x1="86.0" y1="244.5" x2="426.0" y2="244.5" class="grid"/>
<text x="76.0" y="248.5" class="tick" text-anchor="end">1.6</text>
<line x1="86.0" y1="187.0" x2="426.0" y2="187.0" class="grid"/>
<text x="76.0" y="191.0" class="tick" text-anchor="end">1.8</text>
<line x1="86.0" y1="129.5" x2="426.0" y2="129.5" class="grid"/>
<text x="76.0" y="133.5" class="tick" text-anchor="end">2</text>
<line x1="86.0" y1="72.0" x2="426.0" y2="72.0" class="grid"/>
<text x="76.0" y="76.0" class="tick" text-anchor="end">2.2</text>
  <rect x="86" y="72" width="340" height="230" class="axis"/>
  <polyline points="86.7,288.9 89.4,280.7 92.8,274.5 103.0,262.7 120.0,248.9 137.0,237.4 154.0,226.9 171.0,216.8 188.0,207.2 222.0,188.5 256.0,170.3 290.0,152.5 358.0,117.6 426.0,83.2" class="series"/>
  <text x="256" y="358" class="axis-label" text-anchor="middle">Current density [A/cm2]</text>
  <text x="24" y="187" class="axis-label" text-anchor="middle" transform="rotate(-90 24 187)">Cell voltage [V]</text>

  <text x="716" y="34" class="title" text-anchor="middle">Efficiency</text>
  <line x1="546.0" y1="72.0" x2="546.0" y2="302.0" class="grid"/>
<text x="546.0" y="326.0" class="tick" text-anchor="middle">0</text>
<line x1="614.0" y1="72.0" x2="614.0" y2="302.0" class="grid"/>
<text x="614.0" y="326.0" class="tick" text-anchor="middle">1</text>
<line x1="682.0" y1="72.0" x2="682.0" y2="302.0" class="grid"/>
<text x="682.0" y="326.0" class="tick" text-anchor="middle">2</text>
<line x1="750.0" y1="72.0" x2="750.0" y2="302.0" class="grid"/>
<text x="750.0" y="326.0" class="tick" text-anchor="middle">3</text>
<line x1="818.0" y1="72.0" x2="818.0" y2="302.0" class="grid"/>
<text x="818.0" y="326.0" class="tick" text-anchor="middle">4</text>
<line x1="886.0" y1="72.0" x2="886.0" y2="302.0" class="grid"/>
<text x="886.0" y="326.0" class="tick" text-anchor="middle">5</text>
<line x1="546.0" y1="302.0" x2="886.0" y2="302.0" class="grid"/>
<text x="536.0" y="306.0" class="tick" text-anchor="end">65</text>
<line x1="546.0" y1="244.5" x2="886.0" y2="244.5" class="grid"/>
<text x="536.0" y="248.5" class="tick" text-anchor="end">75</text>
<line x1="546.0" y1="187.0" x2="886.0" y2="187.0" class="grid"/>
<text x="536.0" y="191.0" class="tick" text-anchor="end">85</text>
<line x1="546.0" y1="129.5" x2="886.0" y2="129.5" class="grid"/>
<text x="536.0" y="133.5" class="tick" text-anchor="end">95</text>
<line x1="546.0" y1="72.0" x2="886.0" y2="72.0" class="grid"/>
<text x="536.0" y="76.0" class="tick" text-anchor="end">105</text>
  <rect x="546" y="72" width="340" height="230" class="axis"/>
  <polyline points="546.7,86.7 549.4,98.0 552.8,106.3 563.0,121.6 580.0,138.3 597.0,151.6 614.0,163.2 631.0,173.7 648.0,183.5 682.0,201.3 716.0,217.4 750.0,232.2 818.0,258.6 886.0,281.7" class="series"/>
  <text x="716" y="358" class="axis-label" text-anchor="middle">Current density [A/cm2]</text>
  <text x="484" y="187" class="axis-label" text-anchor="middle" transform="rotate(-90 484 187)">Stack efficiency [% HHV]</text>
</svg>